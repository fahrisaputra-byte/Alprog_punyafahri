<!--Pendeklarasian tipe dokumen HTML-->
<!DOCTYPE html>
<!--Pembungkus dokumen HTML-->
<html>
	<!--Berisi metadata dan elemen-elemen yang tidak ditampilkan di halaman utama-->
	<head>
		<!--Judul dari halaman berupa teks "Menu"-->
		<title>Menu</title>
	<!--Pengakhiran tag head-->
	</head>
	<!--<style> adalah tag HTML yang digunakan untuk menuliskan CSS (Cascading Style Sheets), 
	yaitu kode untuk mengatur tampilan website, seperti warna, 
	ukuran tulisan, latar belakang, dan tata letak. Bacground 
	yang digunakan secara keseluruhan ialah aliceblue. 
	Pada bagian box, tampilannya menampilkan inline-block 
	dengan panjang 200px dan tinggi 100px. 
	Latar belakan dari box ialah warna hijau dengan teks berwarna putih. 
	Posisi teksnya berada di tengah box. 
	Ketika box diklik, transisi akan terjadi selama 0.3 detik.
	Pada bagian tampilan keseluruhan, 
	warna latar belakangnya ialah rgba(40, 203, 72, 0.623).-->	
	<style> 
		*{
			background-color: aliceblue;
		}
		.box {
                display: inline-block;
                width: 200px;
                height: 100px;
                background-color: #4CAF50;
                color: white;
                text-align: center;
                line-height: 100px;
                text-decoration: none;
                border-radius: 5px;
                transition: background-color 0.3s ease;
			}
		.tampilan {
			background-color: rgba(40, 203, 72, 0.623);
		}
	</style>
	<!--Pengakhiran tag style-->
	<!-- Bagian ini berisi konten utama dari halaman web -->
	<body>
		<!--Konten utaman berupa teks "menu" dengan heading 1 serta "Curah Hujan" dengan heading 3. Selain itu, terdapat tautan ke halaman curahhujan.html sebagai "Tahun 2022" dan curahhujan21.html sebagai "Tahun 2021" yang ditampilkan dalam box sebagaimana yang didefinisikan dalam CSS. Box tersebut ditampilkan dalam posisi tengah.-->
		<center>
			<h1>Menu</h1>
		<h3>Curah Hujan</h3>
		<a href="curahhujan.html" class="box">
			Tahun 2022
		</a>
		<br></br>
		<a href="curahhujan21.html" class="box">
			Tahun 2021
		</a>
		</center>
	<!--Pengakhiran tag body-->
	</body>
	<!--Pengakhiran tag html-->
</html>
